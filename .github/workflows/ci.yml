name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.85.0", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Framework-only changes must exercise every current consumer immediately.
  # No per-daemon framework pins: this checkout overrides them all.
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: daemon-framework
      - uses: cachix/install-nix-action@v31
      - uses: dtolnay/rust-toolchain@stable
      - name: Check out current consumers
        run: |
          for repo in shelllist app-daemon bar-daemon bt-daemon clip-daemon nm-daemon; do
            git clone --depth 1 --branch main "https://github.com/pmfleming/$repo.git" "$repo"
          done
      - name: Test shared source policy
        run: cargo test --locked --manifest-path daemon-framework/Cargo.toml -p shelllist-local-build
      - name: Test complete current-sibling matrix
        run: daemon-framework/tools/local-build check shelllist --keep-going --print-build-logs
